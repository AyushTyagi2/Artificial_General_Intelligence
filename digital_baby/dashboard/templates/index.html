<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>digital_baby live brain monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { padding: 16px; }
    .title { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .panel { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 10px; }
    .panel h3 { margin: 6px 0 10px; font-size: 15px; color: #cbd5e1; }
    .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 12px; }
    .metric { background: #0b1220; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; }
    .metric .k { color: #93c5fd; font-size: 12px; }
    .metric .v { font-size: 18px; font-weight: 600; }
    #graph { width: 100%; height: 560px; border: 1px solid #1f2937; border-radius: 8px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #rewardChart, #failureChart, #memoryChart, #hypothesisChart { height: 240px; }
    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .controls input, .controls select { background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:4px 6px; }
    .feed { max-height: 520px; overflow: auto; font-size: 13px; }
    .feed-item { border-bottom: 1px solid #1f2937; padding: 6px 0; }
    .feed-item .tick { color:#93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">digital_baby — Live AI Brain Monitor</div>
    <div class="subtitle">Real-time view of knowledge graph, conflicts, hypotheses, failures, and learning reward.</div>

    <div class="metrics">
      <div class="metric"><div class="k">Facts</div><div class="v" id="mFacts">0</div></div>
      <div class="metric"><div class="k">Rules</div><div class="v" id="mRules">0</div></div>
      <div class="metric"><div class="k">Predictions</div><div class="v" id="mPredictions">0</div></div>
      <div class="metric"><div class="k">Experiments</div><div class="v" id="mExperiments">0</div></div>
    </div>

    <div class="grid">
      <div class="panel">
        <h3>Knowledge Graph (conflict belief map)</h3>
        <div class="controls">
          <label>Relation</label>
          <select id="relationFilter"><option value="">All</option></select>
          <label>Min confidence</label>
          <input id="minConfidence" type="number" min="0" max="1" step="0.05" value="0" />
          <button onclick="loadGraph()">Apply</button>
        </div>
        <div id="graph"></div>
      </div>

      <div class="panel">
        <h3>Live Learning Stream</h3>
        <div class="feed" id="liveFeed"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <h3>Learning Metrics</h3>
      <div class="charts">
        <div id="rewardChart"></div>
        <div id="failureChart"></div>
        <div id="memoryChart"></div>
        <div id="hypothesisChart"></div>
      </div>
    </div>
  </div>

  <script>
    const graphEl = document.getElementById('graph');
    let network = null;
    const rewardChart = echarts.init(document.getElementById('rewardChart'));
    const failureChart = echarts.init(document.getElementById('failureChart'));
    const memoryChart = echarts.init(document.getElementById('memoryChart'));
    const hypothesisChart = echarts.init(document.getElementById('hypothesisChart'));

    function setMetrics(memory) {
      document.getElementById('mFacts').textContent = memory.facts ?? 0;
      document.getElementById('mRules').textContent = memory.rules ?? 0;
      document.getElementById('mPredictions').textContent = memory.predictions ?? 0;
      document.getElementById('mExperiments').textContent = memory.experiments ?? 0;
    }

    function renderCharts(metrics, state) {
      const rewards = metrics.reward_history || [];
      const failures = metrics.failure_series || [];
      const summaries = metrics.summaries || [];

      rewardChart.setOption({
        title: { text: 'Reward vs Tick', textStyle: { color: '#cbd5e1', fontSize: 12 } },
        xAxis: { type: 'category', data: rewards.map(p => p.tick), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
        series: [{ type: 'line', smooth: true, data: rewards.map(p => p.reward), showSymbol: false }],
        backgroundColor: 'transparent'
      });

      failureChart.setOption({
        title: { text: 'Prediction Failures over Time', textStyle: { color: '#cbd5e1', fontSize: 12 } },
        xAxis: { type: 'category', data: failures.map(p => p.tick), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
        series: [{ type: 'bar', data: failures.map(p => p.count) }],
        backgroundColor: 'transparent'
      });

      memoryChart.setOption({
        title: { text: 'Memory Growth', textStyle: { color: '#cbd5e1', fontSize: 12 } },
        xAxis: { type: 'category', data: summaries.map(s => s.tick), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
        series: [{ type: 'line', smooth: true, data: summaries.map(s => s.memory), showSymbol: false }],
        backgroundColor: 'transparent'
      });

      hypothesisChart.setOption({
        title: { text: 'Hypotheses Count', textStyle: { color: '#cbd5e1', fontSize: 12 } },
        xAxis: { type: 'category', data: summaries.map(s => s.tick), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
        series: [{ type: 'line', smooth: true, data: summaries.map(s => s.hypotheses), showSymbol: false }],
        backgroundColor: 'transparent'
      });

      setMetrics(metrics.memory || state.memory || {});
    }

    async function loadGraph() {
      const relation = document.getElementById('relationFilter').value;
      const minConf = document.getElementById('minConfidence').value || 0;
      const url = `/api/graph?relation=${encodeURIComponent(relation)}&min_confidence=${encodeURIComponent(minConf)}`;
      const res = await fetch(url);
      const data = await res.json();

      const nodes = new vis.DataSet(data.nodes.map(n => ({ id: n.id, label: n.label, title: n.title })));
      const edges = new vis.DataSet(data.edges.map(e => ({ from: e.from, to: e.to, label: e.label, value: e.value, title: e.title, arrows: 'to' })));

      if (!network) {
        network = new vis.Network(graphEl, { nodes, edges }, {
          interaction: { hover: true, dragNodes: true, zoomView: true },
          physics: { stabilization: false, barnesHut: { springLength: 120 } },
          edges: { smooth: { type: 'dynamic' }, color: { color: '#38bdf8' }, font: { color: '#cbd5e1', size: 11 } },
          nodes: { color: '#1d4ed8', font: { color: '#e2e8f0' } }
        });
      } else {
        network.setData({ nodes, edges });
      }

      const rf = document.getElementById('relationFilter');
      const current = rf.value;
      rf.innerHTML = '<option value="">All</option>';
      (data.stats.relations || []).forEach(r => {
        const o = document.createElement('option');
        o.value = r; o.textContent = r; if (r === current) o.selected = true; rf.appendChild(o);
      });
    }

    async function refreshData() {
      const [stateRes, metricsRes, eventsRes] = await Promise.all([
        fetch('/api/state'),
        fetch('/api/metrics'),
        fetch('/api/stream-snapshot')
      ]);
      const state = await stateRes.json();
      const metrics = await metricsRes.json();
      const events = await eventsRes.json();

      renderCharts(metrics, state);
      renderFeed(events);
    }

    function renderFeed(events) {
      const feed = document.getElementById('liveFeed');
      feed.innerHTML = '';
      [...events].reverse().forEach(ev => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        if (ev.prediction) {
          div.innerHTML = `<span class='tick'>[tick=${ev.tick}]</span> prediction_${ev.kind || 'failed'}: ${ev.prediction}`;
        } else if (ev.kind) {
          div.innerHTML = `<span class='tick'>[tick=${ev.tick}]</span> experiment_${ev.kind}: ${ev.value} ${ev.rule ? `(rule: ${ev.rule})` : ''}`;
        } else {
          div.textContent = JSON.stringify(ev);
        }
        feed.appendChild(div);
      });
    }

    function openWebSocket() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws/stream`);
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.memory) setMetrics(msg.memory);
      };
      ws.onclose = () => setTimeout(openWebSocket, 2000);
    }

    loadGraph();
    refreshData();
    openWebSocket();
    setInterval(refreshData, 2000);
  </script>
</body>
</html>
